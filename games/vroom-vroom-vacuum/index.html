<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini Games">
  <meta name="theme-color" content="#2b2d42">
  <title>Vroom Vroom Vacuum</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icon-192.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2b2d42;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      touch-action: none;
    }
    #controls {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      gap: 10px;
      z-index: 2;
    }
    #controls button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    #controls button svg { width: 24px; height: 24px; }
    #controls button[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="controls">
    <button id="btn-sound" aria-label="Sound on/off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
        <path class="cross" d="M16 9l6 6M22 9l-6 6" style="display:none"/>
      </svg>
    </button>
    <button id="btn-full" aria-label="Full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
  </div>

  <script src="../../shared/home-button.js"></script>
  <script src="game.js"></script>
</body>
</html>
