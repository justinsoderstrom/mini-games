<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="110"/></clipPath>
    <g id="maple"><path d="M0 -40 L11 -14 L38 -12 L17 6 L24 32 L0 18 L-24 32 L-17 6 L-38 -12 L-11 -14 Z" stroke-width="10" stroke-linejoin="round"/></g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#8cc152"/>
    <rect x="0" y="0" width="128" height="512" fill="#82b84a"/>
    <rect x="256" y="0" width="128" height="512" fill="#82b84a"/>
    <rect x="0" y="0" width="512" height="120" fill="#9fd8f5"/>
