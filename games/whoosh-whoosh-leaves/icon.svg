  <ellipse cx="104" cy="214" rx="40" ry="20" fill="#86b8ff" transform="rotate(-25 104 214)"/>
  <ellipse cx="116" cy="264" rx="24" ry="28" fill="#fff" stroke="#2b2d42" stroke-width="7"/>
  <ellipse cx="174" cy="264" rx="24" ry="28" fill="#fff" stroke="#2b2d42" stroke-width="7"/>
  <circle cx="124" cy="270" r="13" fill="#2b2d42"/>
