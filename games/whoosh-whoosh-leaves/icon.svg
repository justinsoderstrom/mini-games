  <circle cx="128" cy="264" r="5" fill="#fff"/>
  <circle cx="186" cy="264" r="5" fill="#fff"/>
  <path d="M122 316 Q145 340 168 316" fill="none" stroke="#2b2d42" stroke-width="8" stroke-linecap="round"/>
  <circle cx="92" cy="306" r="11" fill="rgba(255,120,150,0.5)"/>
  <circle cx="198" cy="306" r="11" fill="rgba(255,120,150,0.5)"/>
