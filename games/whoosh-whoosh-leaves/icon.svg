  <ellipse cx="160" cy="264" rx="13" ry="16" fill="#fff" stroke="#2b2d42" stroke-width="5"/>
  <circle cx="132" cy="266" r="7" fill="#2b2d42"/>
  <circle cx="164" cy="266" r="7" fill="#2b2d42"/>
  <path d="M132 296 Q144 310 156 296" fill="none" stroke="#2b2d42" stroke-width="6" stroke-linecap="round"/>
