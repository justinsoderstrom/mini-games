<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini Games">
  <meta name="theme-color" content="#2b2d42">
  <title>My New Game</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icon-192.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2b2d42;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Hold-to-exit "back to menu" button, shared by every game. -->
  <script src="../../shared/home-button.js"></script>
  <script src="game.js"></script>
</body>
</html>
