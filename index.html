<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mini Games">
  <meta name="theme-color" content="#2b2d42">
  <title>Mini Games</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #2b2d42;
      --ink: #2b2d42;
      --font: "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: var(--font);
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      /* soft polka dots so it feels like a toy box, not a web page */
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 3px, transparent 4px);
      background-size: 38px 38px;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    h1 {
      margin: 8px 0 28px;
      text-align: center;
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: 1px;
      color: #ffd60a;
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
    }
    #games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(16px, 3vw, 32px);
      max-width: 1100px;
      margin: 0 auto;
    }
    .tile {
      width: clamp(220px, 36vw, 320px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 22px 18px 20px;
      border-radius: 32px;
      background: var(--tile, #19b3a6);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.28);
      border: 5px solid rgba(255, 255, 255, 0.85);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      animation: pop-in 0.45s both cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tile:active {
      transform: translateY(8px) scale(0.98);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
    }
    .tile img {
      width: 72%;
      aspect-ratio: 1;
      border-radius: 24%;
      animation: bob 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .tile span {
      font-size: clamp(22px, 3.2vw, 30px);
      font-weight: bold;
      text-align: center;
      line-height: 1.15;
      -webkit-text-stroke: 1.5px var(--ink);
      paint-order: stroke fill;
    }
    @keyframes bob {
      50% { transform: translateY(-8px) rotate(-2deg); }
    }
    @keyframes pop-in {
      from { transform: scale(0.6); opacity: 0; }
    }
    .message {
      max-width: 560px;
      margin: 40px auto;
      padding: 20px 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      -webkit-user-select: text;
      user-select: text;
    }
    .message code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 6px;
    }
    /* Keep the footer at the bottom of the screen, out of the way of the tiles. */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }
    footer {
      margin-top: auto;
      padding-top: 40px;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
    }
    footer a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }
    footer .heart { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>Mini Games</h1>
  <main id="games" aria-label="Games"></main>
  <footer>
    Made with <span class="heart" aria-label="love">&hearts;</span> and
    <a href="https://claude.com/claude-code" target="_blank" rel="noopener">Claude Code</a>
    &middot;
    <a href="https://github.com/justinsoderstrom/mini-games" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>

  <script>
    'use strict';
    // Save everything for offline play. Service workers only run on HTTPS
    // (GitHub Pages) or localhost, so a plain http:// home server skips this.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Reads games/games.json and draws one big tile per game.
    // To add a game, see "Adding a new game" in README.md.
    (async () => {
      const list = document.getElementById('games');

      function showMessage(html) {
        list.outerHTML = `<div class="message">${html}</div>`;
      }

      let games;
      try {
        const res = await fetch('games/games.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        games = (await res.json()).games.filter(g => !g.hidden);
      } catch (err) {
        const fromFile = location.protocol === 'file:';
        showMessage(fromFile
          ? 'Browsers block reading the game list when this page is opened as a file. ' +
            'Start a little web server instead: run <code>python serve.py</code> in this folder ' +
            'and open the address it prints.'
          : `Couldn't load <code>games/games.json</code> (${err.message}). Check that the file exists and is valid JSON.`);
        return;
      }

      if (!games.length) {
        showMessage('No games yet! Add one to <code>games/games.json</code>.');
        return;
      }

      games.forEach((g, i) => {
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = `games/${encodeURIComponent(g.id)}/`;
        a.style.setProperty('--tile', g.color || '#19b3a6');
        a.style.animationDelay = `${i * 0.08}s`;
        a.title = g.description || g.title;

        const img = document.createElement('img');
        img.src = `games/${encodeURIComponent(g.id)}/${g.icon || 'icon.svg'}`;
        img.alt = '';
        img.style.animationDelay = `${i * -0.6}s`;

        const label = document.createElement('span');
        label.textContent = g.title;

        a.append(img, label);
        list.appendChild(a);
      });
    })();
  </script>
</body>
</html>
